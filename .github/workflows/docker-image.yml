name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd /home/computer/BBS-App
          rm -rf node_modules
          npm ci

      - name: Build
        run: |
          cd /home/computer/BBS-App
          npm run build
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Restart PM2
        run: |
          pm2 restart bbs-app || pm2 start /home/computer/BBS-App/ecosystem.config.js
          pm2 save
