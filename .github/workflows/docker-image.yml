name: Docker Image CI
on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      # ... (Steps for build_and_push remain unchanged)
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_NAMEACCOUNT }}/bbs-app:latest
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Cleanup: เก็บคำสั่ง sudo ไว้เพราะเกี่ยวข้องกับระบบไฟล์ของ Runner
      - name: Cleanup runner logs and workdir
        run: |
          echo "🧹 Cleaning up old runner files..."
          # การล้างไฟล์ระบบของ Runner ยังคงต้องใช้ sudo
          sudo rm -rf /home/computer/actions-runner/_diag/*
          sudo rm -rf /home/computer/actions-runner/_work/*

      # 2. Install Docker Compose: เพิ่มการตรวจสอบสิทธิ์และใช้ Shell ที่เหมาะสม
      - name: Install Docker Compose
        # ตั้งค่า shell: bash เพื่อให้แน่ใจว่าใช้ shell มาตรฐาน
        shell: bash
        run: |
          echo "Installing Docker Compose..."
          
          # ตรวจสอบว่าผู้ใช้มีสิทธิ์ใช้ sudo โดยไม่ต้องใส่รหัสผ่านหรือไม่
          # ถ้าไม่มี NOPASSWD หรือมีปัญหา permission อื่นๆ จะล้มเหลวที่นี่
          # คำสั่งติดตั้ง Docker Compose แบบดั้งเดิม
          
          # ตรวจสอบการติดตั้ง Docker Compose
          if command -v docker-compose &>/dev/null; then
              echo "Docker Compose is already installed."
              docker-compose --version
          else
              echo "Installing Docker Compose using sudo curl..."
              
              # ใช้ sudo สำหรับการดาวน์โหลดและ chmod เพราะติดตั้งในไดเรกทอรีระบบ
              # บังคับใช้ Shell เพื่อให้แน่ใจว่าคำสั่งทำงานได้ถูกต้อง
              sudo /bin/bash -c "curl -L 'https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)' -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose"
              
              # ตรวจสอบเวอร์ชันหลังการติดตั้ง
              docker-compose --version
              
              if [ $? -ne 0 ]; then
                  echo "::error::Docker Compose installation failed. Check server sudo permissions."
                  exit 1
              fi
          fi

      # 3. Deploy: ลบคำสั่ง sudo ทั้งหมดที่เกี่ยวข้องกับ Docker
      - name: Deploy with Docker Compose
        run: |
          cd /home/computer/bbs/
          echo "Pruning system and pulling image..."
          # ลบคอนเทนเนอร์, อิมเมจที่ไม่ได้ใช้งาน (และ volumes) ก่อน pull
          # ไม่ต้องใช้ sudo เพราะ user 'computer' อยู่ในกลุ่ม docker แล้ว
          docker system prune --volumes -f
          docker-compose pull
          docker-compose up -d --force-recreate
          # ลบอิมเมจที่ห้อยอยู่ (dangling images)
          docker images --filter "dangling=true" --format "{{.ID}}" | xargs -r docker rmi
