name: Docker Image CI
on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      # ... (Steps for build_and_push remain unchanged)
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_NAMEACCOUNT }}/bbs-app:latest
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Cleanup: เก็บคำสั่ง sudo ไว้เพราะเกี่ยวข้องกับระบบไฟล์ของ Runner
      - name: Cleanup runner logs and workdir
        run: |
          echo "🧹 Cleaning up old runner files..."
          # การล้างไฟล์ระบบของ Runner ยังคงต้องใช้ sudo
          sudo rm -rf /home/computer/actions-runner/_diag/*
          sudo rm -rf /home/computer/actions-runner/_work/*

      # 2. Install Docker Compose: ลบ sudo ที่เรียกใช้ docker-compose
      # (ยังคงต้องใช้ sudo สำหรับ curl/chmod เพราะติดตั้งใน /usr/local/bin)
      - name: Install Docker Compose
        run: |
          echo "Installing Docker Compose..."
          # ใช้ sudo สำหรับการดาวน์โหลดและ chmod เพราะติดตั้งในไดเรกทอรีระบบ
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          # ตรวจสอบเวอร์ชัน: ควรจะทำงานได้โดยไม่ต้องใช้ sudo หากติดตั้งถูกต้อง
          docker-compose --version

      # 3. Deploy: ลบคำสั่ง sudo ทั้งหมดที่เกี่ยวข้องกับ Docker
      - name: Deploy with Docker Compose
        run: |
          cd /home/computer/bbs/
          echo "Pruning system and pulling image..."
          # ลบคอนเทนเนอร์, อิมเมจที่ไม่ได้ใช้งาน (และ volumes) ก่อน pull
          # ไม่ต้องใช้ sudo เพราะ user 'computer' อยู่ในกลุ่ม docker แล้ว
          docker system prune --volumes -f
          docker-compose pull
          docker-compose up -d --force-recreate
          # ลบอิมเมจที่ห้อยอยู่ (dangling images)
          docker images --filter "dangling=true" --format "{{.ID}}" | xargs -r docker rmi
