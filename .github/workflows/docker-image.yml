name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_NAMEACCOUNT }}/bbs-app:latest
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cleanup runner logs and workdir
        run: |
          echo "🧹 Cleaning up old runner files..."
          sudo rm -rf /home/computer/actions-runner/_diag/*
          sudo rm -rf /home/computer/actions-runner/_work/*

      - name: Install Docker Compose
        run: |
          # ติดตั้ง Docker Compose โดยใช้ curl
          # (คำสั่งอาจแตกต่างกันไปตามเวอร์ชันของ Docker Compose)
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          # ตรวจสอบเวอร์ชันเพื่อยืนยันการติดตั้ง
          docker-compose --version

      - name: Deploy with Docker Compose
        run: |
          cd /home/computer/bbs/
          # ลบคอนเทนเนอร์, อิมเมจที่ไม่ได้ใช้งาน (และ volumes) ก่อน pull
          # sudo docker system prune --volumes -f
          # sudo docker-compose pull
          # sudo docker-compose up -d --force-recreate
          # ลบอิมเมจที่ห้อยอยู่ (dangling images)
          # sudo docker images --filter "dangling=true" --format "{{.ID}}" | xargs -r docker rmi
